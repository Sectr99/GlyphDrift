# Weekly PRs for outdated GitHub Actions (pinned to commit SHAs) and Cargo dependencies.
# Security alerts arrive regardless; these keep versions current so fixes are small.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # The windows crate's 0.x releases rename APIs and need porting by hand, so they come
      # as their own PR instead of holding back everything else.
      windows:
        patterns: ["windows*"]
      cargo:
        patterns: ["*"]
        exclude-patterns: ["windows*"]
