# Build, test and lint both platforms on every push and pull request. Make both jobs
# required checks on `main` (Settings > Branches) so neither build can break unnoticed.
# Actions are pinned to commit SHAs (Dependabot keeps them current); warnings are denied
# on the clippy runs, not through RUSTFLAGS, which would override .cargo/config.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked -p glyphdrift-saver -- -D warnings
      - run: cargo test --locked
      # The app bundle, for this runner's architecture only; releases build universal.
      - run: macos/bundle.sh --native
      # The website's images (the gallery and the Settings window), drawn offscreen: a look
      # at the Mac window on every change, and fresh site/img without a Mac
      # (web/build-assets.sh turns them into WebP).
      - run: target/release/glyphdrift --screenshots screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
      # The website's live previews: the animations as WebAssembly.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy --locked -p glyphdrift-web --release --target wasm32-unknown-unknown -- -D warnings
