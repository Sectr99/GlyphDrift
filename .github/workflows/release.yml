# Push a version tag (git tag v0.1.4 && git push origin v0.1.4) to build both platforms
# and create a draft release with glyphdrift.exe, Glyphdrift-macos.zip and SHA-256
# checksums. Both keep fixed names, so releases/latest/download/<name> links stay valid.
# Review the draft's notes on GitHub, then publish it. Builds use --locked (exactly the
# committed Cargo.lock) and no caches, so a release can't pick up anything unreviewed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo test --locked
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: target/release/glyphdrift.exe
          if-no-files-found: error

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: cargo test --locked
      # Universal (Apple silicon + Intel), ad-hoc signed.
      - run: macos/bundle.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: dist/Glyphdrift-macos.zip
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd assets
          sha256sum glyphdrift.exe Glyphdrift-macos.zip > SHA256SUMS.txt
          {
            echo "## Downloads"
            echo
            echo "- **Windows 10/11:** \`glyphdrift.exe\`. Not code-signed yet, so SmartScreen may warn on first run."
            echo "- **macOS 12+ (Apple silicon and Intel):** \`Glyphdrift-macos.zip\`. Not notarized yet, so macOS blocks the first launch: open **System Settings > Privacy & Security**, scroll down and click **Open Anyway**."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Glyphdrift $VERSION" \
            --notes-file notes.md \
            glyphdrift.exe Glyphdrift-macos.zip SHA256SUMS.txt
