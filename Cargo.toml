[package]
name = "glyphdrift"
version = "0.2.6"
edition = "2021"
description = "Glyphdrift: a lightweight live wallpaper for Windows and macOS"

# `web` builds the animations to WebAssembly for the website; `saver` is the macOS screen saver.
[workspace]
members = ["web", "saver"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Parses config.toml (serde) and edits it keeping its comments.
toml_edit = { version = "0.25", features = ["serde"] }

# Direct2D's point type (Vector2); already in the tree via windows, which doesn't re-export it.
[target.'cfg(windows)'.dependencies.windows-numerics]
version = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Storage",
    "Storage_Streams",
    "System_UserProfile",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

# AppKit, Metal, Core Graphics and Core Text bindings for the macOS host.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
