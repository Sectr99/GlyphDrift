[package]
name = "glyphdrift-saver"
version = "0.2.8"
edition = "2021"
description = "Glyphdrift as a macOS screen saver (Glyphdrift.saver)"
publish = false

# Loaded by macOS's screen saver host; macos/bundle.sh wraps it in Glyphdrift.saver.
[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "macos")'.dependencies]
glyphdrift = { path = ".." }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-screen-saver = "0.3"
